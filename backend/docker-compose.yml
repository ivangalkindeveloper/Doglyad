version: "3.9"

services:
  backend:
    build: .
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - secrets/.env
      - ${ENV_FILE:-secrets/.env.development.stub}