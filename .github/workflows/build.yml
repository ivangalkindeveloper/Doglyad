name: Build backend images

# Собирает образы обоих бэкендов и кладёт их в GitHub Container Registry.
# На виртуалках нет ни исходников, ни сборки: они делают docker compose pull.
on:
  # Пока только вручную: кнопка "Run workflow" на вкладке Actions. Сборка по пушу
  # в master добавится, когда развёртывание обкатается.
  workflow_dispatch:

permissions:
  contents: read
  # Без этого docker push в ghcr.io получит 403.
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Два независимых образа, собираются параллельно.
      matrix:
        service: [main, inference]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Выдаётся Actions автоматически, заводить свой токен не нужно.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Dockerfile и .dockerignore берутся из этого каталога.
          context: backend/${{ matrix.service }}
          # Виртуалки — amd64, машина разработчика может быть arm64: архитектуру
          # задаём явно, чтобы образ не зависел от того, где его собрали.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}:latest
          # Слои между запусками переиспользуются: pip install не повторяется,
          # пока не менялся requirements.txt.
          cache-from: type=gha
          cache-to: type=gha,mode=max
