#cloud-config
#
# THIS LINE IS MANDATORY AND MUST COME FIRST. cloud-init decides from it whether
# the payload is a config at all; without it the file is silently ignored and the
# machine comes up bare.
#
# Pasted into user-data when the VM is created. Runs once, as root, on first boot.
#
# All the work lives in deploy/bootstrap.sh, which this only fetches and runs. A
# provider that accepts user-data and one that does not therefore produce the same
# machine; without user-data, run that script yourself:
#
#   curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 \
#     -o /tmp/doglyad-bootstrap.sh \
#     https://raw.githubusercontent.com/ivangalkindeveloper/Doglyad/master/deploy/bootstrap.sh
#   sudo bash /tmp/doglyad-bootstrap.sh main
#
# The same file serves main-development and main-production and knows nothing
# about either: no login, no domain, no environment. All of that arrives later
# over ssh — see the final message.
#
# Deliberately holds no secrets: user-data is readable from inside the machine
# through the metadata service and is stored by the provider.
#
# Deliberately does not start the stack: the backend would not come up without its
# secrets anyway, and Caddy would burn Let's Encrypt attempts while the domain
# still points elsewhere.

package_update: true
packages:
  - ca-certificates
  - curl

runcmd:
  - |
    set -eu
    bootstrap_path=/run/doglyad-bootstrap.sh
    curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 -o "$bootstrap_path" \
      https://raw.githubusercontent.com/ivangalkindeveloper/Doglyad/master/deploy/bootstrap.sh
    bash "$bootstrap_path" main

final_message: |
  The machine is configured. Reboot once so the docker group applies, then:

    1. Three lines of configuration for this machine:

       ssh LOGIN@HOST 'cat > /opt/doglyad/.env' <<EOF
       TAG=latest
       ENV_FILE=secrets/.env.development
       DOMAIN=HOST
       EOF

       for production: ENV_FILE=secrets/.env.production

    2. Secrets, and the first start:

       deploy/sync-secrets.sh main LOGIN@HOST

  Log of this run: /var/log/cloud-init-output.log
